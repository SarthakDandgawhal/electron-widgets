name: Release Win11 Widgets

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
      platforms:
        description: 'Platforms to build'
        required: true
        type: choice
        options:
          - windows-only
          - all-platforms
        default: 'windows-only'

permissions:
  contents: write
  packages: write

jobs:
  dispatch-build:
    name: Dispatch Build
    runs-on: ubuntu-latest
    steps:
      - name: Create release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ github.event.inputs.version }}" -m "Release v${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}"

      - name: Wait for builds to complete
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = `v${{ github.event.inputs.version }}`;
            
            // Wait for workflow runs triggered by the tag push
            let attempts = 0;
            const maxAttempts = 60; // 30 minutes
            
            while (attempts < maxAttempts) {
              const runs = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo,
                event: 'push',
                branch: 'refs/tags/' + tag,
                per_page: 10
              });
              
              const buildRuns = runs.data.workflow_runs.filter(r => 
                r.name === 'Build Win11 Widgets' || r.name?.includes('Build')
              );
              
              if (buildRuns.length === 0) {
                console.log('No build runs found yet, waiting...');
                await new Promise(r => setTimeout(r, 30000));
                attempts++;
                continue;
              }
              
              const allCompleted = buildRuns.every(r => r.status === 'completed');
              const anyFailed = buildRuns.some(r => r.conclusion === 'failure');
              
              if (anyFailed) {
                core.setFailed('One or more builds failed');
                return;
              }
              
              if (allCompleted) {
                console.log('All builds completed successfully!');
                return;
              }
              
              console.log(`Waiting for ${buildRuns.filter(r => r.status !== 'completed').length} builds to complete...`);
              await new Promise(r => setTimeout(r, 30000));
              attempts++;
            }
            
            core.setFailed('Build timeout exceeded');