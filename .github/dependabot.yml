version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/electron-widgets"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      dev-dependencies:
        patterns:
          - "@types/*"
          - "typescript"
          - "vite*"
          - "electron*"
          - "@vitejs/*"
      production-dependencies:
        patterns:
          - "react*"
          - "zustand"
          - "lucide-react"
          - "electron-store"
          - "electron-updater"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "github-actions"